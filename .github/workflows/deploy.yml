name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 自动取消同一 branch / PR 上尚未完成的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────
  #  CI：每次 push / PR 都跑（lint / type / test / build）
  # ───────────────────────────────────────────
  ci:
    name: Lint / Type / Test / Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Type check (functions / Cloudflare)
        run: npx tsc -p tsconfig.functions.json

      - name: Unit tests (Vitest)
        run: npm test
        env:
          CI: 'true'

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      # 上传构建产物：deploy job 下载它；失败时也可手动下载诊断
      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ───────────────────────────────────────────
  #  Deploy：仅 main 分支直接 push 触发（PR 不部署）
  # ───────────────────────────────────────────
  deploy:
    name: Deploy to Cloudflare Pages
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 下载 ci job 产物，无需重新 install / build
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      # 部署前先应用 D1 迁移（建表 / 加列）。
      # ⚠️ 本步 **禁止** continue-on-error：v0.8.0 曾因该选项导致迁移 0007/0008
      #    静默失败但代码照常上线，引发「激活码兑换 500」「共享表缺失」。
      #    迁移失败必须阻断部署（fail-fast），否则就是「代码新、库旧」的暗雷。
      #    首次部署前需先本地 `npx wrangler d1 create lumi-db` 创建远程库。
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply lumi-db --remote --account-id ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 迁移校验（defense-in-depth）：apply 成功后仍主动核验关键表/列是否真实存在，
      # 缺一则中止部署。避免「apply 报成功但实际漏建」这类诡异不一致。
      - name: Verify D1 schema
        run: |
          set -euo pipefail
          REQUIRED_TABLES="shared_vaults shared_members shared_meta subscriptions users key_backup analytics_events donations_aggregate"
          echo "→ 校验关键数据表是否存在"
          TABLES=$(npx wrangler d1 execute lumi-db --remote --account-id "$CLOUDFLARE_ACCOUNT_ID" --command "SELECT name FROM sqlite_master WHERE type='table';" --json 2>&1) || { echo "❌ 查询 sqlite_master 失败"; exit 1; }
          for t in $REQUIRED_TABLES; do
            if ! echo "$TABLES" | grep -Eq "\"name\"[[:space:]]*:[[:space:]]*\"$t\""; then
              echo "❌ 缺失数据表: $t"
              exit 1
            fi
          done
          echo "→ 校验 subscriptions.billing_cycle 列"
          COLS=$(npx wrangler d1 execute lumi-db --remote --account-id "$CLOUDFLARE_ACCOUNT_ID" --command "PRAGMA table_info(subscriptions);" --json 2>&1) || { echo "❌ 查询 subscriptions schema 失败"; exit 1; }
          if ! echo "$COLS" | grep -Eq "\"name\"[[:space:]]*:[[:space:]]*\"billing_cycle\""; then
            echo "❌ subscriptions 缺少 billing_cycle 列（迁移 0007 未生效）"
            exit 1
          fi
          echo "✅ D1 schema 校验通过"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # wrangler-action 自动处理：
      #   - 编译 functions/ 下的 TS Pages Functions
      #   - 读取 wrangler.toml（D1 binding + GOOGLE_CLIENT_ID 等）
      #   - 部署 dist/ 到 Cloudflare Pages
      # GOOGLE_CLIENT_SECRET 等敏感变量在 Cloudflare Dashboard 配置，
      # 不出现在本 workflow 文件中。
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=lumi --branch=main --commit-dirty=true