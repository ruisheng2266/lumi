name = Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pass env vars as wrangler command-line arguments
          # This ensures they are available to Pages Functions at runtime
          command: >-
            pages deploy ./dist
            --project-name=lumi
            --branch=main
            --commit-dirty=true
            --var "PUBLIC_URL:https://lumi365.com"
            --var "GOOGLE_CLIENT_ID:54402477675-6a5coh6frtdtq51btf1018bl3kf6df48.apps.googleusercontent.com"
            --secret-name GOOGLE_CLIENT_SECRET
        env:
          # Secret passed via env so it's not visible in command line
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || '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' }}