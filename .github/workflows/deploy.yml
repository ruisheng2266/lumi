name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      # Deploy via wrangler-action which:
      # - Auto-compiles TS Pages Functions
      # - Picks up functions/ directory
      # - Reads wrangler.toml for config (D1 binding, env vars)
      # Secrets (GOOGLE_CLIENT_SECRET) are read from Cloudflare env vars
      # at runtime, not from the workflow file.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v2
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=lumi --branch=main --commit-dirty=true