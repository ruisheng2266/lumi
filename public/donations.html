<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumi 打赏统计</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #7c5cff;
      --accent-soft: #ece8ff;
      --good: #16a34a;
      --bar: #7c5cff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1117;
        --card: #181b22;
        --text: #e8eaf0;
        --muted: #9aa3b2;
        --border: #2a2f3a;
        --accent: #9b86ff;
        --accent-soft: #211f33;
        --good: #4ade80;
        --bar: #9b86ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.5; padding: 24px;
    }
    .wrap { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .codebar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .codebar input {
      flex: 1; min-width: 200px; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 14px;
    }
    .codebar button {
      padding: 10px 18px; border-radius: 10px; border: none; cursor: pointer;
      background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
    }
    .codebar button:disabled { opacity: .5; cursor: default; }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    @media (max-width: 680px){ .kpis { grid-template-columns: repeat(2,1fr);} }
    .kpi {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px;
    }
    .kpi .label { color: var(--muted); font-size: 12px; }
    .kpi .value { font-size: 26px; font-weight: 700; margin-top: 4px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 18px; margin-bottom: 20px;
    }
    .card h2 { font-size: 15px; margin: 0 0 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .err { color: #dc2626; font-size: 13px; }
    .muted { color: var(--muted); }
    .pill { display:inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Lumi 打赏统计 <span class="pill">匿名聚合 · 仅 PayPal</span></h1>
    <div class="sub">数据来自 D1 <code>donations_aggregate</code>，仅累计金额/笔数/时间，不含任何身份信息。需 ADMIN_CODE。国内微信/支付宝扫码不在此统计内。</div>

    <div class="codebar">
      <input id="code" type="password" placeholder="输入 ADMIN_CODE" autocomplete="off" />
      <button id="load">加载</button>
    </div>

    <div id="status"></div>

    <div class="kpis" id="kpis" style="display:none">
      <div class="kpi"><div class="label">总笔数</div><div class="value" id="k-count">–</div></div>
      <div class="kpi"><div class="label">累计总额 (USD)</div><div class="value" id="k-usd">–</div></div>
      <div class="kpi"><div class="label">近 30 日笔数</div><div class="value" id="k-30c">–</div></div>
      <div class="kpi"><div class="label">近 30 日额 (USD)</div><div class="value" id="k-30u">–</div></div>
    </div>

    <div class="card" id="curCard" style="display:none">
      <h2>按币种</h2>
      <table id="curTable"><thead><tr><th>币种</th><th class="num">笔数</th><th class="num">合计金额</th></tr></thead><tbody></tbody></table>
    </div>

    <div class="card" id="monthCard" style="display:none">
      <h2>按月趋势（近 12 月，USD）</h2>
      <table id="monthTable"><thead><tr><th>月份</th><th class="num">笔数</th><th class="num">金额 (USD)</th></tr></thead><tbody></tbody></table>
    </div>

    <div class="card" id="recentCard" style="display:none">
      <h2>最近 20 笔</h2>
      <table id="recentTable"><thead><tr><th>时间</th><th>币种</th><th class="num">金额</th></tr></thead><tbody></tbody></table>
    </div>
  </div>

  <script src="donations.js"></script>
</body>
</html>
