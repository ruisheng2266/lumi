<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumi 留存看板</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #7c5cff;
      --accent-soft: #ece8ff;
      --good: #16a34a;
      --bar: #7c5cff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1117;
        --card: #181b22;
        --text: #e8eaf0;
        --muted: #9aa3b2;
        --border: #2a2f3a;
        --accent: #9b86ff;
        --accent-soft: #211f33;
        --good: #4ade80;
        --bar: #9b86ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.5; padding: 24px;
    }
    .wrap { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .codebar {
      display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .codebar input {
      flex: 1; min-width: 200px; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      font-size: 14px;
    }
    .codebar button {
      padding: 10px 18px; border-radius: 10px; border: none; cursor: pointer;
      background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
    }
    .codebar button:disabled { opacity: .5; cursor: default; }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    @media (max-width: 680px){ .kpis { grid-template-columns: repeat(2,1fr);} }
    .kpi {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 16px;
    }
    .kpi .label { color: var(--muted); font-size: 12px; }
    .kpi .value { font-size: 26px; font-weight: 700; margin-top: 4px; }
    .kpi .value.small { font-size: 20px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 18px; margin-bottom: 20px;
    }
    .card h2 { font-size: 15px; margin: 0 0 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .chart { width: 100%; height: 200px; }
    .legend { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .err { color: #dc2626; font-size: 13px; }
    .muted { color: var(--muted); }
    .pill { display:inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Lumi 留存看板 <span class="pill">匿名 · 按 install_id</span></h1>
    <div class="sub">数据来自 D1 <code>analytics_events</code>，不含任何个人信息。需 ADMIN_CODE。</div>

    <div class="codebar">
      <input id="code" type="password" placeholder="输入 ADMIN_CODE" autocomplete="off" />
      <button id="load">加载</button>
    </div>

    <div id="status"></div>

    <div class="kpis" id="kpis" style="display:none">
      <div class="kpi"><div class="label">总安装数</div><div class="value" id="k-total">–</div></div>
      <div class="kpi"><div class="label">总事件数</div><div class="value" id="k-events">–</div></div>
      <div class="kpi"><div class="label">近 7 日活跃</div><div class="value" id="k-7d">–</div></div>
      <div class="kpi"><div class="label">近 30 日活跃</div><div class="value" id="k-30d">–</div></div>
    </div>

    <div class="card" id="curveCard" style="display:none">
      <h2>留存曲线（距首次使用天数 → 留存率）</h2>
      <svg class="chart" id="chart" viewBox="0 0 1000 200" preserveAspectRatio="none"></svg>
      <div class="legend" id="curveLegend"></div>
    </div>

    <div class="card" id="cohortCard" style="display:none">
      <h2>同期群规模（按首次使用日，近 60 天）</h2>
      <div style="overflow:auto; max-height:300px">
        <table id="cohortTable"><thead><tr><th>首次使用日</th><th class="num">安装数</th></tr></thead><tbody></tbody></table>
      </div>
    </div>

    <div class="card" id="eventCard" style="display:none">
      <h2>事件 TOP 20</h2>
      <table id="eventTable"><thead><tr><th>事件</th><th class="num">次数</th><th class="num">涉及安装</th></tr></thead><tbody></tbody></table>
    </div>
  </div>

  <script src="retention.js"></script>
</body>
</html>
