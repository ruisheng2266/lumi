name = "lumi"
compatibility_date = "2026-07-24"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "lumi-db"
database_id = "df3085f6-b32f-4e71-9447-95c20e62fbe0"

# Public environment variables (non-secret)
# GOOGLE_CLIENT_ID is a public identifier; safe to commit
[vars]
PUBLIC_URL = "https://lumi365.com"
GOOGLE_CLIENT_ID = "54402477675-6a5coh6frtdtq51btf1018bl3kf6df48.apps.googleusercontent.com"

# GOOGLE_CLIENT_SECRET must be set via Cloudflare Dashboard or wrangler secret