name = "lumi"
compatibility_date = "2026-07-24"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "lumi-db"
database_id = "df3085f6-b32f-4e71-9447-95c20e62fbe0"

# R2 bucket for E2EE sync blobs (Phase 2)
# 密文 blob 存 R2，sync_meta 索引仍放 D1。
# 创建命令：npx wrangler r2 bucket create lumi-sync
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "lumi-sync"

# Public environment variables (non-secret)
# GOOGLE_CLIENT_ID is a public identifier; safe to commit
[vars]
PUBLIC_URL = "https://lumi365.com"
GOOGLE_CLIENT_ID = "54402477675-6a5coh6frtdtq51btf1018bl3kf6df48.apps.googleusercontent.com"

# GOOGLE_CLIENT_SECRET must be set via Cloudflare Dashboard or wrangler secret
# （以下 Apple OAuth 相关均为 secret，用 `wrangler secret put` 配置，勿提交明文）
#   APPLE_CLIENT_ID      Service ID（如 com.lumi.app）
#   APPLE_TEAM_ID        Apple Developer Team ID
#   APPLE_KEY_ID         Auth Key ID（如 XXXXXXXXXX）
#   APPLE_P8            AuthKey_XXXXXXXXX.p8 私钥内容
#   APPLE_REDIRECT_URI  https://lumi365.com/auth/apple/callback
